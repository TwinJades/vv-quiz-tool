<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VV Provider 设置</title>
    <link rel="stylesheet" href="ui.css">
  </head>
  <body class="options-page">
    <main>
      <header class="page-header">
        <div><span id="extension-version" class="eyebrow"></span><h1>Provider 设置</h1></div>
        <div class="header-actions"><div id="options-language-slot"></div><button id="new-profile" type="button">新建配置</button></div>
      </header>
      <p class="notice">所有配置与密钥仅保存在浏览器本地。API Key 不会显示在 Provider 列表中。</p>
      <section class="panel">
        <h2>本地 Provider</h2>
        <div id="profile-list" class="stack"></div>
      </section>
      <section class="panel">
        <h2>编辑配置</h2>
        <form id="provider-form" class="form-grid">
          <input id="profile-id" type="hidden">
          <label>显示名称<input id="display-name" required autocomplete="off" placeholder="例如：个人 CPA"></label>
          <label>接口类型<select id="provider-type"><option value="openai_compatible">OpenAI 兼容（CPA 等）</option><option value="google">Google Gemini 原生接口</option><option value="anthropic">Anthropic 原生接口</option></select></label>
          <label>服务地址<input id="base-url" type="url" required placeholder="https://provider.example/v1"></label>
          <label>API Key<input id="api-key" type="password" autocomplete="new-password" placeholder="编辑时留空表示保持原值"></label>
          <div class="provider-capabilities full">
            <label class="check"><input id="image-input" type="checkbox">允许此 Provider 图片输入</label>
            <label class="check"><input id="native-search" type="checkbox">允许此 Provider 原生网页搜索</label>
          </div>
          <p class="muted full">开启后，必要题目图片或搜索内容会发送给此 Provider，适用于其全部模型。</p>
          <p id="search-support" class="muted full"></p>
          <fieldset class="provider-batch full">
            <legend>Provider 分批限制</legend>
            <div class="batch-fields">
              <label>每批最多题数<input id="batch-questions" type="number" min="1" max="50" value="5" required></label>
              <label>每批内容预算（估算 token）<input id="batch-tokens" type="number" min="1" max="10000000" value="12000" required></label>
              <label>每批最多图片<input id="batch-images" type="number" min="0" max="64" value="4" required></label>
            </div>
            <p class="muted">全部模型共用此 Provider 的分批限制；接口返回的输入上限仍会限制请求大小。</p>
          </fieldset>
          <label class="full">模型 ID（自动读取失败时每行填写一个）<textarea id="models" rows="5" placeholder="model-a&#10;model-b"></textarea></label>
          <button class="primary full" type="submit">保存 Provider</button>
        </form>
        <p id="status" role="status"></p>
      </section>
    </main>
    <script src="options.js"></script>
  </body>
</html>
