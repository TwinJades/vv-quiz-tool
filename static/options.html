<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VV Provider 设置</title>
    <link rel="stylesheet" href="ui.css">
  </head>
  <body class="options-page">
    <main>
      <header class="page-header">
        <div><span class="eyebrow">VV 1.0</span><h1>Provider 设置</h1></div>
        <button id="new-profile" type="button">新建配置</button>
      </header>
      <p class="notice">所有配置与密钥仅保存在浏览器本地。API Key 不会显示在 Provider 列表中。</p>
      <section class="panel">
        <h2>本地 Provider</h2>
        <div id="profile-list" class="stack"></div>
      </section>
      <section class="panel">
        <h2>编辑配置</h2>
        <form id="provider-form" class="form-grid">
          <input id="profile-id" type="hidden">
          <label>显示名称<input id="display-name" required autocomplete="off" placeholder="例如：个人 CPA"></label>
          <label>接口类型<select id="provider-type"><option value="openai_compatible">OpenAI 兼容（CPA 等）</option><option value="google">Google Gemini 原生接口</option><option value="anthropic">Anthropic 原生接口</option></select></label>
          <label>服务地址<input id="base-url" type="url" required placeholder="https://provider.example/v1"></label>
          <label>API Key<input id="api-key" type="password" autocomplete="new-password" placeholder="编辑时留空表示保持原值"></label>
          <label>模型 ID（自动读取失败时每行填写一个）<textarea id="models" rows="5" placeholder="model-a&#10;model-b"></textarea></label>
          <label class="check"><input id="image-input" type="checkbox">该模型支持图片输入</label>
          <label class="check"><input id="image-authorization" type="checkbox">允许将必要题目图片发送给此 Provider</label>
          <label>已确认支持原生搜索的模型 ID（每行一个）<textarea id="search-models" rows="2" disabled placeholder="仅 Anthropic 原生接口；需确认账号与模型支持"></textarea></label>
          <fieldset class="full">
            <legend>模型分批限制（可选）</legend>
            <label>适用模型<select id="batch-model"><option value="">先填写或读取模型列表</option></select></label>
            <label class="check"><input id="batch-custom" type="checkbox" disabled>为此模型保存自定义限制</label>
            <label>每批最多题数<input id="batch-questions" type="number" min="1" max="50" value="5" disabled></label>
            <label>每批内容预算（估算 token）<input id="batch-tokens" type="number" min="1" max="10000000" value="12000" disabled></label>
            <label>每批最多图片<input id="batch-images" type="number" min="0" max="64" value="4" disabled></label>
            <p class="muted">默认每批最多 5 题、内容预算 12000、4 张图。若接口提供该模型的输入上限，会进一步缩小内容预算；估算不能保证实际 token 数。每个模型独立保存。</p>
          </fieldset>
          <p class="muted full">图片授权只保存在本机；截图模式会发送必要题目区域的截图，并可由模型识别 Canvas 题目。搜索能力声明不等于授权，每场需在启动面板另行开启。</p>
          <button class="primary full" type="submit">保存 Provider</button>
        </form>
        <p id="status" role="status"></p>
      </section>
    </main>
    <script src="options.js"></script>
  </body>
</html>
